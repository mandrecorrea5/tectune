services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cifras}
      POSTGRES_USER: ${POSTGRES_USER:-cifras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifras}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-cifras}:${POSTGRES_PASSWORD:-cifras}@db:5432/${POSTGRES_DB:-cifras}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db_data:
