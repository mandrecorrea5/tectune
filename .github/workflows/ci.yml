name: CI

on:
  push:
    branches: [main]
  pull_request:
  # re-publicar o que já está no ar sem mudar código (ex.: depois de mexer no .env)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cifras
          POSTGRES_USER: cifras
          POSTGRES_PASSWORD: cifras
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cifras" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Núcleo (packages/core)
        working-directory: packages/core
        run: npm test

      - name: Dependências do web
        working-directory: apps/web
        run: npm ci

      - name: API + testes de ponta a ponta
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://cifras:cifras@localhost:5432/cifras
          BASE_URL: http://localhost:3000
        run: |
          node src/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
          node --test test/*.test.js || { cat /tmp/api.log; exit 1; }

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -f apps/web/Dockerfile -t tectune-app:ci .
      - name: Validar docker-compose.prod.yml
        run: |
          docker network create ingress
          POSTGRES_PASSWORD=x docker compose -f docker-compose.prod.yml config -q

  deploy:
    name: Deploy
    needs: [testes, imagem]
    # PR nunca publica; push na main e workflow_dispatch sim
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-tectune
      cancel-in-progress: false
    steps:
      # A chave do CI é travada no servidor (`restrict,command=`): só consegue rodar
      # /usr/local/bin/tectune-deploy, que aceita apenas "deploy <sha>" (deploy/remote-deploy.sh).
      - name: Chave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "::warning::VPS_SSH_KEY não configurado — deploy pulado"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # publica exatamente o commit que este run validou
      - name: Publicar
        if: env.SKIP != '1'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "$USER@$HOST" "deploy ${{ github.sha }}"

      - name: Smoke test
        if: env.SKIP != '1'
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null --connect-timeout 3 --max-time 10 -w "%{http_code}" https://tectune.com.br/api/health || echo 000)
            echo "health $i: $code"; [ "$code" = "200" ] && break; sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::/api/health não respondeu 200"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" https://tectune.com.br/); echo "home: $code"; [ "$code" = "200" ]
          loc=$(curl -s -o /dev/null -w "%{redirect_url}" https://www.tectune.com.br/); echo "www → $loc"; [ "$loc" = "https://tectune.com.br/" ]
