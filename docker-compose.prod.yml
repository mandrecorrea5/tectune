# Produção: Cloudflare → Caddy (HTTPS, porta 443) → app (Node) → Postgres
# Subir:   docker compose -f docker-compose.prod.yml up -d --build
# (o script scripts/deploy.sh faz isso e mais as checagens)
name: tectune

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tectune}
      POSTGRES_USER: ${POSTGRES_USER:-tectune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 20
    shm_size: 128mb
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: tectune-app:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tectune}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tectune}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      TZ: ${TZ:-America/Fortaleza}
    networks: [internal]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-tectune.com.br}
    env_file:
      - path: deploy/cloudflare.env   # faixas de IP da Cloudflare (scripts/cloudflare-ips.sh)
        required: false
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-tectune}
      PGUSER: ${POSTGRES_USER:-tectune}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      TZ: ${TZ:-America/Fortaleza}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    networks: [internal]
    logging: *logging

networks:
  internal:

volumes:
  db_data:
  caddy_data:
  caddy_config:
