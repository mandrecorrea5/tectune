# Produção na VPS compartilhada (187.41.102.127), em /srv/apps/tectune.
#
#   internet ──▶ ingress-caddy (80/443, Let's Encrypt; stack "ingress" da VPS)
#                   └─ network `ingress` ──▶ tectune-app:3000 ──▶ tectune-postgres
#
# - Nenhuma porta é publicada no host: só o ingress-caddy fala com o app.
# - O roteamento mora em deploy/caddy/tectune.caddy (instalado por deploy/reload-caddy.sh).
# - A network externa `ingress` já existe na VPS (docker network create ingress).
#
# Deploy: GitHub Actions → ssh deploy@vps "deploy <sha>" → deploy/remote-deploy.sh
name: tectune

services:
  db:
    image: postgres:16-alpine
    container_name: tectune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tectune}
      POSTGRES_USER: ${POSTGRES_USER:-tectune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (deploy/provision-env.sh)}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 20
    shm_size: 128mb
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: tectune-app:latest
    container_name: tectune-app
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tectune}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tectune}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      TZ: ${TZ:-America/Fortaleza}
    networks: [internal, ingress]
    deploy:
      resources:
        limits: { memory: 384M }
    logging: *logging

  backup:
    image: postgres:16-alpine
    container_name: tectune-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-tectune}
      PGUSER: ${POSTGRES_USER:-tectune}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      TZ: ${TZ:-America/Fortaleza}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *logging

networks:
  internal:
  ingress:
    name: ingress
    external: true

volumes:
  db_data:
