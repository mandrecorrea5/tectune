<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tectune — Entrar no show</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0D0C}
a{color:#FF7A2F}a:hover{color:#FFA16B}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 22px; background: #0E0D0C; color: #F4F0EA; font-family: Archivo, system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 22px; height: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
      <span style="background: #F4F0EA; border-radius: 2px"></span><span style="background: #FF7A2F; border-radius: 2px"></span><span style="background: #F4F0EA; border-radius: 2px"></span><span style="background: #F4F0EA; border-radius: 2px"></span>
    </span>
    <b style="font-size: 16px; font-weight: 800; letter-spacing: -.02em">Tectune</b>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #C9C2B7">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #FF7A2F; color: #1A0E05; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">MC</span>
      Marcos te chamou para tocar
    </p>
    <div style="padding: 18px; border-radius: 18px; background: #171614; border: 1px solid #2E2B27">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em">Casamento Ana &amp; Pedro</h1>
      <p style="margin: 8px 0 0; font-size: 14px; color: #C9C2B7">Sáb, 21 nov · 19h · Espaço Villa</p>
      <p style="margin: 4px 0 0; font-size: 14px; color: #A39C92">12 músicas · 52 min</p>
    </div>
  </div>

  <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
    <legend style="padding: 0; margin-bottom: 10px; font-size: 18px; font-weight: 800">O que você toca?</legend>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="6">
        <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 4px 0 0; min-height: 40px; font-size: 13.5px; line-height: 1.45; color: #C9C2B7">{{hint}}</p>
  </fieldset>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #A39C92">
    Seu nome
    <input value="{{name}}" onChange="{{onName}}" placeholder="Como a banda te chama" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #34302B; background: #171614; color: #F4F0EA; font: inherit; font-size: 16px; font-weight: 600">
  </label>

  <span style="flex: 1"></span>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Palco.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #FF7A2F; color: #1A0E05; text-decoration: none; font-size: 17px; font-weight: 800">Entrar no show</a>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #A39C92; text-align: center">Sem cadastro. Seu tom, tamanho de letra e instrumento ficam salvos neste celular.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ROLES = [
  { id: 'voz', label: 'Voz', hint: 'Você vê a letra grande, com o acorde por cima e a entrada marcada um compasso antes.' },
  { id: 'harm', label: 'Violão / Guitarra', hint: 'Acordes grandes no compasso, com o capo e o seu tom pessoal aplicados.' },
  { id: 'baixo', label: 'Baixo', hint: 'Acordes com a nota do baixo em destaque (Ab/C mostra o C).' },
  { id: 'tecla', label: 'Teclado', hint: 'Acordes completos, com as frases escritas na pauta quando existirem.' },
  { id: 'bat', label: 'Bateria', hint: 'Estrutura, repetições, breques e anotações. Sem acordes miúdos.' },
  { id: 'outro', label: 'Outro', hint: 'A cifra completa, do jeito que o diretor escreveu.' }
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { role: 'baixo', name: 'Rafa' }; }
  renderVals() {
    var self = this, st = this.state, cur = ROLES.filter(function (r) { return r.id === st.role; })[0];
    return {
      roles: ROLES.map(function (r) {
        var on = r.id === st.role;
        return {
          label: r.label, pressed: on ? 'true' : 'false',
          pick: function () { self.setState({ role: r.id }); },
          style: 'min-height: 64px; padding: 8px; border-radius: 14px; font-size: 14px; font-weight: 700; line-height: 1.2; ' +
            (on ? 'border: 2px solid #FF7A2F; background: #2A1D14; color: #FFB48A' : 'border: 1px solid #2E2B27; background: #171614; color: #F4F0EA')
        };
      }),
      hint: cur.hint, name: st.name,
      onName: function (e) { self.setState({ name: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
